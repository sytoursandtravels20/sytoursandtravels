<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SY Tours and Travels</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .coming-soon {
            text-align: center;
            max-width: 700px;
            padding: 50px 25px;
        }

        .logo-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #d6e4ea;
            margin-top: 15px;
        }

        .badge-custom {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            border-radius: 50px;
            background: white;
            color: #203a43;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: 50px;
            color: #b8cbd2;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="coming-soon mx-auto">

            <div class="logo-icon">
                ✈️
            </div>

            <h1>SY Tours and Travels</h1>

            <p class="subtitle">
                Your journey begins here.
            </p>

            <div class="badge-custom">
                COMING SOON
            </div>

            <p class="footer">
                We are working on something exciting.<br>
                Our website will be launching soon!
            </p>

        </div>
    </div>

</body>
</html>
